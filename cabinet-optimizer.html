<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e5f4b">
  <title>Woodworking Material Optimizer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e5f4b'/%3E%3Cpath d='M6 8h20v16H6z' fill='%23f9d9a8'/%3E%3Cpath d='M16 8v16M6 17h10' stroke='%231e5f4b' stroke-width='2'/%3E%3C/svg%3E">
  <style>
:root {
  --bg: #f3f0e9;
  --card: #ffffff;
  --ink: #1f1b16;
  --muted: #655e52;
  --line: #ddd6c8;
  --line-strong: #c4bbaa;
  --accent: #1e5f4b;
  --accent-ink: #ffffff;
  --accent-soft: #e4f0eb;
  --bad: #b3261e;
  --bad-soft: #fdecea;
  --warn: #8a5a00;
  --warn-soft: #fff4d6;
  --good: #26734d;
  --cut: #c62828;
  --radius: 10px;
  --field-h: 36px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  color: var(--ink);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 64px; }
body { margin: 0; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; margin-top: 18px; margin-bottom: 6px; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---- header ------------------------------------------------------------ */
.app-head {
  display: flex; align-items: center; gap: 12px;
  padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  background: var(--card); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; flex: none; }
.brand h1 { font-size: 1.05rem; letter-spacing: -0.01em; white-space: nowrap; }
.job-name {
  flex: 1; min-width: 0; height: var(--field-h); padding: 0 10px;
  border: 1px solid transparent; border-radius: 6px; background: transparent; font-weight: 600;
}
.job-name:hover { border-color: var(--line); }
.job-name:focus { border-color: var(--accent); background: #fff; outline: none; }
.menu-wrap { position: relative; flex: none; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 230px;
  background: var(--card); border: 1px solid var(--line-strong); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(40, 30, 10, 0.16); padding: 6px;
}
.menu button { display: block; width: 100%; text-align: left; padding: 9px 10px; border: 0; background: none; border-radius: 6px; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--accent-soft); outline: none; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

.tabs {
  position: sticky; top: 0; z-index: 20; display: flex; gap: 4px;
  padding: 8px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  background: var(--bg); border-bottom: 1px solid var(--line-strong);
}
.tabs button {
  padding: 9px 18px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0;
  background: none; cursor: pointer; font-weight: 600; color: var(--muted); margin-bottom: -1px;
}
.tabs button[aria-selected="true"] { background: var(--card); border-color: var(--line-strong); color: var(--ink); }
.flag { margin-left: 6px; padding: 1px 7px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 0.75rem; font-weight: 600; }

main { flex: 1; width: 100%; max-width: 1320px; margin: 0 auto; padding: 16px; }
.app-foot { padding: 10px 16px 18px; text-align: center; color: var(--muted); font-size: 0.8rem; }

/* ---- generic ----------------------------------------------------------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.card-head { margin-bottom: 12px; }
.row-head .has-tip { position: relative; text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; outline: none; }
.has-tip:hover::after, .has-tip:focus::after, label.f[data-tip]:focus-within::after {
  content: attr(data-tip); position: absolute; left: 0; top: calc(100% + 6px); z-index: 40;
  width: max-content; max-width: 240px; padding: 7px 10px; border-radius: 6px;
  background: #2b2a26; color: #fff; font-size: 0.82rem; font-weight: 400; line-height: 1.35;
  text-transform: none; letter-spacing: 0; white-space: normal; text-decoration: none;
  box-shadow: 0 4px 14px rgba(0,0,0,.2); pointer-events: none;
}
label.f[data-tip] { position: relative; }
.f-bandL[data-tip]::after, .f-bandW[data-tip]::after, .f-faces[data-tip]::after, .f-qty[data-tip]::after { left: auto; right: 0; }
@media (min-width: 901px) { label.f[data-tip]:focus-within::after { content: none; } }
.sub, .fine, .hint { color: var(--muted); font-size: 0.87rem; }
.sub { margin-top: 4px; max-width: 78ch; }
.fine { margin-top: 8px; max-width: 90ch; }
.btn {
  height: var(--field-h); padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 7px;
  background: #fff; cursor: pointer; font-weight: 600; white-space: nowrap;
}
.btn:hover { background: #f7f4ee; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: #184e3e; }
.btn.big { height: 46px; padding: 0 22px; font-size: 1rem; }
.btn.icon { flex: none; width: var(--field-h); padding: 0; display: inline-grid; place-items: center; }
.btn.add { margin-top: 10px; border-style: dashed; color: var(--accent); }
.icon-btn { width: 32px; height: 32px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--muted); }
.icon-btn:hover { background: var(--bad-soft); color: var(--bad); }
.link { border: 0; background: none; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

input[type="text"], select {
  width: 100%; height: var(--field-h); padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: #fff; min-width: 0;
}
select { padding-right: 2px; }
input[type="text"]:focus, select:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); vertical-align: -3px; }

/* ---- settings ---------------------------------------------------------- */
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px 20px; margin-top: 12px; }
.setting { display: flex; flex-direction: column; gap: 4px; }
.setting-label { font-weight: 600; font-size: 0.9rem; }
.with-unit { display: flex; align-items: center; gap: 6px; }
.with-unit input { max-width: 120px; }
.unit { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; align-self: flex-start; }
.seg button { height: var(--field-h); padding: 0 14px; border: 0; background: #fff; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
fieldset.choice { border: 0; padding: 0; margin: 16px 0 0; min-width: 0; }
fieldset.choice legend { padding: 0; margin-bottom: 6px; }
.choice-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-bottom: 6px; }
.choice-opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; cursor: pointer; }
.choice-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.choice-opt input { flex: none; width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
.choice-text { display: flex; flex-direction: column; gap: 2px; }
details.more { margin-top: 14px; }
details.more > summary, details.all-steps > summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.field-msg { font-size: 0.85rem; }
.field-msg.error { color: var(--bad); }
.field-msg.warning { color: var(--warn); }

/* ---- stock and panel rows --------------------------------------------- */
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: grid; gap: 6px; align-items: center; }
.stock-row { grid-template-columns: 26px minmax(140px, 2.2fr) 84px 92px 92px 132px 150px 76px 90px 32px; }
.panel-row { grid-template-columns: 34px minmax(130px, 2fr) 86px 86px 58px minmax(170px, 2fr) 128px 116px 78px 78px 32px; }
.row-head { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; padding-bottom: 2px; }
.row-head .f { padding-left: 2px; }
.row-num { color: var(--muted); font-size: 0.85rem; text-align: right; padding-right: 2px; font-variant-numeric: tabular-nums; }
.f { display: block; min-width: 0; }
.f .lbl { display: none; }
.f.invalid input, .f.invalid select { border-color: var(--bad); background: var(--bad-soft); }
.f.warned input, .f.warned select { border-color: #c79a2b; background: var(--warn-soft); }
.row-msgs { grid-column: 2 / -1; }
.row-msgs:empty { display: none; }
.msg { font-size: 0.85rem; padding: 1px 0 4px; }
.msg.error { color: var(--bad); }
.msg.warning { color: var(--warn); }

.issues { background: var(--bad-soft); border: 1px solid #f2b8b5; color: #7a1a14; border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; }
.issues ul { margin: 6px 0 0; padding-left: 20px; }
.issues li { margin: 3px 0; }

.calc-bar {
  position: sticky; bottom: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 0 -16px -16px; padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background: rgba(255, 255, 255, 0.96); border-top: 1px solid var(--line-strong); backdrop-filter: blur(6px);
}
.calc-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.job-summary { color: var(--muted); font-size: 0.9rem; }
.issue-count { border: 0; background: none; padding: 0; color: var(--bad); font-weight: 600; cursor: pointer; text-align: left; text-decoration: underline; }

/* ---- results ----------------------------------------------------------- */
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px; border: 1px solid; }
.banner.warn { background: var(--warn-soft); border-color: #e6c36a; color: #5c3d00; }
.banner.bad { display: block; background: var(--bad-soft); border-color: #f2b8b5; color: #7a1a14; }
.banner.note { background: #eef3fb; border-color: #c5d5ef; color: #26406b; font-size: 0.9rem; }
.banner ul { margin: 6px 0; padding-left: 20px; }
.empty { text-align: center; padding: 48px 16px; }
.empty p { margin: 8px 0 18px; color: var(--muted); }
.row-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.jump { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 4px; scrollbar-width: thin; }
.jump a { flex: none; padding: 5px 12px; border: 1px solid var(--line-strong); border-radius: 16px; background: #fff; color: inherit; text-decoration: none; font-size: 0.87rem; font-weight: 600; }
.jump a:hover { background: var(--accent-soft); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fbfaf7; }
.stat-value { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.stat-label { font-weight: 600; font-size: 0.9rem; margin-top: 2px; }
.stat-note { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }

.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.tbl th, .tbl td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); white-space: nowrap; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .strong { font-weight: 700; }
.tbl .group-row td { background: #f6f3ec; font-weight: 700; }
.tbl .total-row td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--line-strong); }
.tbl a { color: inherit; }
.tbl .nowrap { white-space: nowrap; }
.favor-note { font-size: 0.92rem; max-width: 90ch; margin-bottom: 8px; }
.favor-note .table-wrap { margin-top: 8px; }
.good { color: var(--good); font-weight: 600; }
.meh { color: var(--warn); }
.bad { color: var(--bad); font-weight: 600; }
.swatch { display: inline-block; min-width: 34px; padding: 1px 6px; border: 1px solid; border-radius: 5px; text-align: center; font-size: 0.82rem; font-weight: 600; }

.sheets-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 22px 2px 4px; }
.toggle { font-size: 0.9rem; cursor: pointer; }

.sheet-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.sheet-head h3 { margin: 0; font-size: 1.1rem; }
.sheet-meta { font-weight: 600; }
.sheet-facts { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 0.88rem; width: 100%; }
.sheet-facts .progress:not(:empty) { color: var(--good); font-weight: 600; }
.face-note { margin-top: 8px; padding: 7px 10px; background: var(--warn-soft); border-radius: 6px; font-size: 0.88rem; }
.sheet-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 12px; }
@media (min-width: 1000px) {
  .sheet-body { grid-template-columns: minmax(0, 3fr) minmax(300px, 2fr); grid-template-rows: auto 1fr; align-items: start; }
  .sheet-figure { grid-column: 1; grid-row: 1 / span 2; }
  .stepper { grid-column: 2; grid-row: 1; }
  details.all-steps { grid-column: 2; grid-row: 2; }
}
.sheet-figure { min-width: 0; }
.figure { width: 100%; }
.offcut-list { margin-top: 6px; }
.zoom-btn { display: block; margin: 8px auto 0; padding: 6px 10px; color: var(--accent); font-weight: 600; }

.stepper { border: 1px solid var(--line-strong); border-radius: 8px; padding: 12px; background: #fbfaf7; }
.stepper-nav { display: flex; align-items: center; gap: 8px; }
.stepper-nav .btn { min-width: 48px; height: 42px; }
.stepper-pos { flex: 1; text-align: center; font-weight: 700; }
.step-title { font-size: 1.2rem; font-weight: 700; margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 4px; color: #fff; }
.tag.rip { background: #3f6fa8; } .tag.cross { background: #8a5fb0; } .tag.trim { background: #7a7263; }
.step-how { margin-top: 6px; font-size: 0.92rem; }
.parts { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.part { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
.part::before { content: "→"; color: var(--muted); }
.part.panel { border-color: #9fcdb5; background: #eef8f2; }
.part.waste, .part.none { color: var(--muted); }
.part-name { font-weight: 600; }
.part-detail { color: var(--muted); font-size: 0.88rem; }
.done-toggle { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 10px; border-radius: 6px; background: var(--accent-soft); font-weight: 600; cursor: pointer; }

details.all-steps { margin-top: 0; }
.steps { list-style: none; margin: 8px 0 0; padding: 0; max-height: 440px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
.step { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.step:last-child { border-bottom: 0; }
.step > input { margin-top: 5px; flex: none; }
.step.sel { background: #fff3cd; }
.step.done .step-text { color: #8a8478; text-decoration: line-through; text-decoration-color: #b9b3a6; }
.step-body { display: flex; gap: 8px; flex: 1; min-width: 0; border: 0; background: none; padding: 2px 0; text-align: left; cursor: pointer; }
.step-n { flex: none; width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid var(--cut); color: var(--cut); font-size: 0.78rem; font-weight: 700; display: grid; place-items: center; }
.step.done .step-n { border-color: var(--good); color: var(--good); }
.step-text { font-size: 0.9rem; min-width: 0; }
.step-from { color: var(--muted); }
.step-gives { display: block; color: var(--muted); font-size: 0.85rem; }

/* ---- sheet drawing ----------------------------------------------------- */
.sheet-svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.sheet-svg text { font-family: inherit; }
.hatch-bg { fill: #ebe6da; }
.hatch-line { stroke: #d3cab8; stroke-width: 2; }
.sheet-edge { fill: none; stroke: #4f483c; stroke-width: 1.4; }
.piece { stroke-width: 1; cursor: pointer; }
.piece:hover { filter: brightness(0.95); }
.piece-label .l1 { font-weight: 650; fill: #1f1b16; }
.piece-label .l2 { fill: #453f35; }
.offcut { fill: #ffffff; stroke: #9a9284; stroke-width: 1; stroke-dasharray: 4 3; }
.offcut-label text { fill: #6b6458; font-style: italic; }
.cut { stroke: var(--cut); opacity: 0.55; }
.cut.done { stroke: var(--good); opacity: 0.7; }
.cut-hot { stroke: #e53935; }
.cut-hit { stroke: transparent; stroke-width: 14; cursor: pointer; }
.badge { cursor: pointer; }
.badge circle { fill: #fff; stroke: var(--cut); stroke-width: 1.3; }
.badge text { font-size: 9px; font-weight: 700; fill: var(--cut); }
.badge.done circle { stroke: var(--good); fill: #e7f4ea; }
.badge.done text { fill: var(--good); }
.badge.sel circle { fill: #e53935; stroke: #8e1b17; }
.badge.sel text { fill: #fff; }
.dim-mask { fill: rgba(255, 255, 255, 0.66); pointer-events: none; }
.wp-outline { fill: none; stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 7 4; pointer-events: none; }
.dim-text { font-size: 11px; fill: #5b5346; }
.measure path { stroke: #1d4ed8; stroke-width: 1.6; fill: none; }
.measure rect { fill: #1d4ed8; }
.measure text { fill: #fff; font-size: 12px; font-weight: 700; }

/* ---- overlays ---------------------------------------------------------- */
.busy { position: fixed; inset: 0; z-index: 100; background: rgba(30, 25, 15, 0.45); display: grid; place-items: center; padding: 16px; }
.busy-box { background: #fff; border-radius: 12px; padding: 22px 24px; width: min(380px, 100%); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3); }
.busy-title { font-weight: 700; font-size: 1.05rem; }
.bar { height: 8px; background: #e9e4d8; border-radius: 4px; margin: 14px 0 8px; overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.15s; }
.busy-text { color: var(--muted); font-size: 0.87rem; }
.dialog { border: 0; border-radius: 12px; padding: 22px; width: min(420px, calc(100% - 32px)); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3); }
.dialog::backdrop { background: rgba(30, 25, 15, 0.45); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 90; background: #2b2620; color: #fff; padding: 10px 16px; border-radius: 8px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3); }

/* ---- narrow screens ---------------------------------------------------- */
@media (max-width: 900px) {
  :root { --field-h: 42px; }
  input[type="text"], select, .job-name { font-size: 16px; } /* stops iOS zooming into fields */
  main { padding: 10px; }
  .card { padding: 12px; }
  .brand h1 { display: none; }
  .tabs { padding-left: 10px; padding-right: 10px; }
  .tabs button { flex: 1; padding: 10px 8px; }
  .row-head { display: none; }
  .row { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fbfaf7; align-items: end; }
  .row.has-error { border-color: #e9a09b; }
  .row-num { grid-column: 1 / 6; grid-row: 1; text-align: left; font-weight: 700; align-self: center; }
  .row .del { grid-column: 6; grid-row: 1; justify-self: end; }
  .f .lbl { display: block; font-size: 0.74rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-name, .f-material, .f-stockId { grid-column: span 6; }
  .f-thickness, .f-length, .f-width { grid-column: span 2; }
  .panel-row .f-qty { grid-column: span 2; }
  .stock-row .f-qty, .stock-row .f-price, .f-grain, .f-faces, .f-bandL, .f-bandW { grid-column: span 3; }
  .row-msgs { grid-column: 1 / -1; }
  .calc-bar { margin: 0 -10px -10px; }
  .calc-bar .btn.big { padding: 0 16px; }
  .stat-value { font-size: 1.4rem; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tbl { font-size: 0.86rem; }
  .tbl th, .tbl td { padding: 6px 6px; }
  .tbl th { white-space: normal; }
  .steps { max-height: none; }
  .toast { bottom: 96px; }
}
@media (max-width: 700px) {
  .wide-only { display: none; }
}
@media (max-width: 480px) {
  .calc-bar { flex-direction: column; align-items: stretch; }
  .calc-info { flex-direction: row; justify-content: space-between; gap: 10px; }
}

/* ---- paper ------------------------------------------------------------- */
@media print {
  :root { font-size: 11pt; }
  body { background: #fff; display: block; }
  .app-head .menu-wrap, #print-btn, .tabs, .app-foot, .calc-bar, .jump, .banner.warn .btn, .toggle, .stepper, .busy, .toast, #view-job, .done-toggle { display: none !important; }
  .app-head { border: 0; padding: 0 0 6pt; }
  .brand h1 { display: block; }
  .job-name { border: 0; padding: 0; }
  main { max-width: none; padding: 0; }
  #view-plan { display: block !important; }
  .card { border: 0; padding: 0; margin-bottom: 14pt; }
  .sheet-card { break-before: page; }
  .sheet-body { display: block; }
  .wide-only { display: table-cell !important; }
  .zoom-btn { display: none !important; }
  .figure { max-width: 100%; }
  .steps { max-height: none; overflow: visible; border: 0; columns: 2; column-gap: 18pt; }
  .step { break-inside: avoid; padding: 3pt 0; }
  .step.sel { background: none; }
  details.all-steps > summary { list-style: none; color: inherit; margin-top: 8pt; }
  .dim-mask, .wp-outline, .cut-hot, .measure { display: none; }
  .tbl { font-size: 9.5pt; }
  #res-cutlist { break-before: page; }
}
</style>
</head>
<body>
  <header class="app-head">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#1e5f4b"/><path d="M6 8h20v16H6z" fill="#f9d9a8"/><path d="M16 8v16M6 17h10" stroke="#1e5f4b" stroke-width="2"/></svg>
      <h1>Woodworking Material Optimizer</h1>
    </div>
    <input id="job-name" class="job-name" type="text" placeholder="Name this job" aria-label="Job name" autocomplete="off">
    <div class="menu-wrap">
      <button id="menu-btn" class="btn" type="button" aria-haspopup="true" aria-expanded="false">Project Files ▾</button>
      <div id="menu" class="menu" hidden>
        <button type="button" data-act="example">Load the example job</button>
        <button type="button" data-act="new">New empty job</button>
        <hr>
        <button type="button" data-act="import">Open a job file…</button>
        <button type="button" data-act="export">Save job to a file</button>
      </div>
    </div>
    <button id="print-btn" class="btn icon" type="button" title="Print the cutting plan" aria-label="Print the cutting plan">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="9" rx="2"/><rect x="7" y="14" width="10" height="7" fill="#fff"/><path d="M17 12.5h.01"/></svg>
    </button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button id="tab-job" role="tab" type="button" aria-controls="view-job">1 · Job</button>
    <button id="tab-plan" role="tab" type="button" aria-controls="view-plan">2 · Cutting plan <span id="plan-flag" class="flag" hidden>out of date</span></button>
  </nav>

  <main>
    <div id="view-job" role="tabpanel" aria-labelledby="tab-job"></div>
    <div id="view-plan" role="tabpanel" aria-labelledby="tab-plan" hidden></div>
  </main>

  <footer class="app-foot">
    <span id="sync-status">Saved in this browser</span>
  </footer>

  <div id="busy" class="busy" hidden role="status" aria-live="polite">
    <div class="busy-box">
      <div class="busy-title">Working out the best layout…</div>
      <div class="bar"><div id="busy-bar" class="bar-fill"></div></div>
      <div id="busy-text" class="busy-text">Trying thousands of arrangements</div>
    </div>
  </div>

  <dialog id="confirm" class="dialog">
    <form method="dialog">
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn" type="submit">Cancel</button>
        <button value="ok" class="btn primary" type="submit" id="confirm-ok">OK</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden role="status"></div>
  <input type="file" id="file" accept=".json,application/json" hidden>
